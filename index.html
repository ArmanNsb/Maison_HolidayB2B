<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison De La Fork — Holiday Season 2026</title>
  <style>
    /* عرض اصلی طرح؛ اگه فایل PNG عرض دیگه‌ای داره، این عدد رو عوض کن */
    :root {
      --design-width: 1440px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #ffffff;   /* رنگ کناره‌ها روی صفحه‌های بزرگ */
    }

    main {
      width: 100%;
      max-width: var(--design-width);
      margin: 0 auto;
    }

    main img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <img src="design.png" alt="Maison De La Fork — Holiday Season 2026">
  </main>
</body>
</html>
